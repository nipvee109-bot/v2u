# Build V2U and publish it to GitHub Pages (https://nipvee109-bot.github.io/v2u/).
# Only browser-safe values are used: the Supabase project URL and the PUBLIC
# anon/publishable key (repository variables). vite.config.ts refuses to build
# with a service-role/secret key, and the scan below fails the job if one leaks.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Lesson evidence cites CPython 3.11; test-phase-63 verifies quotes against that exact version.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - name: Build
        run: npm run build
        env:
          V2U_BASE: /v2u/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html
      - name: Refuse to publish secrets
        run: node scripts/check-dist-secrets.mjs dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
